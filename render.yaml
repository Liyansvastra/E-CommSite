services:
  - type: web
    name: liyans-vastra-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONTACT_TO_EMAIL
        value: info@liyansvastra.com
      - key: SMTP_HOST
        value: server147.nethost.in
      - key: SMTP_FALLBACK_HOSTS
        value: server147.nethost.in
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        value: info@liyansvastra.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: info@liyansvastra.com
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://e-comm-site-xi.vercel.app,https://liyansvastra.github.io
