apiVersion: apps/v1
kind: Deployment
metadata:
  name: liyans-vastra-frontend
  labels:
    app: liyans-vastra-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liyans-vastra-frontend
  template:
    metadata:
      labels:
        app: liyans-vastra-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/liyans-vastra-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: liyans-vastra-frontend
spec:
  selector:
    app: liyans-vastra-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
