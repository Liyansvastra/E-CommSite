apiVersion: apps/v1
kind: Deployment
metadata:
  name: liyans-vastra-backend
  labels:
    app: liyans-vastra-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liyans-vastra-backend
  template:
    metadata:
      labels:
        app: liyans-vastra-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/liyans-vastra-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: liyans-vastra-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: liyans-vastra-backend
spec:
  selector:
    app: liyans-vastra-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
